<!DOCTYPE html>
<html lang="uk" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBank | Твій сучасний банкінг</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom styling -->
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neo: {
                            blue: '#00aaff',
                            dark: '#0f172a',
                            card: '#1e293b',
                            accent: '#38bdf8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-neo-dark text-slate-100 min-h-screen font-sans">
    <header class="bg-neo-card/50 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="text-xl font-black text-neo-blue tracking-tighter">NEOBANK</div>
            <nav class="flex gap-8">
                <a href="index.html"
                    class="text-xs font-bold uppercase tracking-widest hover:text-neo-blue transition-colors">Home</a>
                <button onclick="router.navigate('catalog')"
                    class="text-xs font-bold uppercase tracking-widest hover:text-neo-blue transition-colors">Catalog</button>
            </nav>
        </div>
    </header>

    <div id="root" class="flex flex-col min-h-screen">
        <main id="app-content" class="flex-grow">
            <div class="flex items-center justify-center min-h-screen">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-neo-blue"></div>
            </div>
        </main>

        <nav id="main-nav"
            class="hidden fixed bottom-0 left-0 right-0 bg-neo-card/80 backdrop-blur-lg border-t border-slate-700 px-6 py-3 flex justify-around items-center z-50 md:top-0 md:bottom-auto md:flex-col md:left-0 md:w-20 md:h-full md:justify-center md:gap-8 md:border-t-0 md:border-r">
            <button onclick="router.navigate('dashboard')" class="nav-item flex flex-col items-center gap-1 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">🏠</span>
                <span
                    class="text-[10px] uppercase tracking-tighter text-slate-400 group-hover:text-neo-blue">Головна</span>
            </button>
            <button onclick="router.navigate('transfers')" class="nav-item flex flex-col items-center gap-1 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">💸</span>
                <span
                    class="text-[10px] uppercase tracking-tighter text-slate-400 group-hover:text-neo-blue">Перекази</span>
            </button>
            <button onclick="router.navigate('analytics')" class="nav-item flex flex-col items-center gap-1 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">📊</span>
                <span
                    class="text-[10px] uppercase tracking-tighter text-slate-400 group-hover:text-neo-blue">Аналітика</span>
            </button>
            <button onclick="app.logout()"
                class="nav-item flex flex-col items-center gap-1 group mt-auto hidden md:flex">
                <span class="text-2xl group-hover:scale-110 transition-transform">🚪</span>
                <span
                    class="text-[10px] uppercase tracking-tighter text-slate-400 group-hover:text-red-400">Вихід</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>

</html>
